name: Firmware

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0

      - name: Use tag as firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PLATFORMIO_BUILD_FLAGS=-DVERSION=\\\"${GITHUB_REF_NAME}\\\"" >> "$GITHUB_ENV"

      - name: Compile firmware
        run: pio run

      - name: Build LittleFS image
        run: pio run --target buildfs

      - name: Verify tagged firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['GITHUB_REF_NAME']
          image = Path('.pio/build/303WIFILC01/firmware.elf').read_bytes()
          assert version.encode() in image, f'Firmware does not contain {version}'
          print(f'PASS: firmware contains {version}')
          PY

      - name: Package build artifacts
        run: python scripts/package_release.py

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          retention-days: 7

  release:
    name: Publish release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/7-segment-esp-clock-ota.bin
            dist/7-segment-esp-clock-full.bin
            dist/SHA256SUMS
