name: Firmware

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0

      - name: Compile firmware
        run: pio run

      - name: Package build artifacts
        run: |
          mkdir dist
          cp .pio/build/303WIFILC01/firmware.bin dist/7-segment-esp-clock-firmware.bin
          cp .pio/build/303WIFILC01/firmware.elf dist/7-segment-esp-clock-firmware.elf
          cd dist
          sha256sum 7-segment-esp-clock-firmware.bin 7-segment-esp-clock-firmware.elf > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          retention-days: 7

  release:
    name: Publish release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/7-segment-esp-clock-firmware.bin
            dist/7-segment-esp-clock-firmware.elf
            dist/SHA256SUMS
